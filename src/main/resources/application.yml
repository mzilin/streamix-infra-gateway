# Server configuration
server:
  port: 8080

# Application metadata
info:
  app:
    environment: ${spring.profiles.active:default}
    name: ${spring.application.name}
    description: Streamix API Gateway

# Spring application and infrastructure configuration
spring:
  application:
    name: infra-gateway
  main:
    web-application-type: reactive
  config:
    import:
      - optional:configserver:discovery://config-server
      - classpath:gateway-routes.yml
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

# Service discovery configuration
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Security configuration
security:
  access-token-secret: ${ACCESS_TOKEN_SECRET}
  cluster-keys:
    AUTH: ${AUTH_CLUSTER_KEY}
    USERS: ${USERS_CLUSTER_KEY}
    MEDIA: ${MEDIA_CLUSTER_KEY}
    DISCOVERY: ${DISCOVERY_CLUSTER_KEY}
    STREAMING: ${STREAMING_CLUSTER_KEY}
    BILLING: ${BILLING_CLUSTER_KEY}

# Frontend configuration
frontend:
  base-url: http://localhost:3077
  allowed-origins: http://localhost:3077

# Actuator and observability configuration
management:
  info:
    env:
      enabled: true
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: info, health, gateway, prometheus
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    resource-attributes:
      service.namespace: streamix
      deployment.environment: ${spring.profiles.active:default}
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  tracing:
    sampling:
      probability: 1.0

# Application logging configuration
logging:
  level:
    root: INFO
    com.mariuszilinskas.streamix: INFO
    com.netflix: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.cloud.gateway: WARN